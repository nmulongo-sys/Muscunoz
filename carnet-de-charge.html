<style>
[hidden]{display:none!important}img{max-width:100%}
/* Layout: one-screen app, sticky header, scrolling panel, bottom tab bar; data-dense cards, chalk-on-rubber palette */
:root{
  --bg:#f3f1ec; --card:#ffffff; --fg:#1d1b17; --muted:#6b665c; --line:#d9d4ca;
  --accent:#c2541b; --accent-fg:#ffffff; --accent-soft:#f6e3d8;
  --ok:#2e7d4f; --warn:#b4780a; --bad:#b3261e; --ok-soft:#dff0e5; --warn-soft:#fbeccb; --bad-soft:#f8dcd9;
  --chart-line:#c2541b; --chart-grid:#e3dfd6;
  --g1:#2e7d4f; --g1-soft:#dff0e5; --g2:#c2541b; --g2-soft:#f6e3d8; --g3:#2f5fa8; --g3-soft:#dde7f5; --g4:#7a4ca0; --g4-soft:#ebe0f3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a; --card:#232227; --fg:#efece6; --muted:#a39d92; --line:#3a383f;
  --accent:#f08a4b; --accent-fg:#1a1208; --accent-soft:#3b2619;
  --ok:#6ccf93; --warn:#f2c35b; --bad:#ff7b72; --ok-soft:#1d3327; --warn-soft:#3a2f12; --bad-soft:#3d1f1d;
  --chart-line:#f08a4b; --chart-grid:#33313a; --g1:#6ccf93; --g1-soft:#1d3327; --g2:#f08a4b; --g2-soft:#3b2619; --g3:#7fa6e8; --g3-soft:#1c2a42; --g4:#c39be0; --g4-soft:#2e2238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161a; --card:#232227; --fg:#efece6; --muted:#a39d92; --line:#3a383f;
  --accent:#f08a4b; --accent-fg:#1a1208; --accent-soft:#3b2619;
  --ok:#6ccf93; --warn:#f2c35b; --bad:#ff7b72; --ok-soft:#1d3327; --warn-soft:#3a2f12; --bad-soft:#3d1f1d;
  --chart-line:#f08a4b; --chart-grid:#33313a; --g1:#6ccf93; --g1-soft:#1d3327; --g2:#f08a4b; --g2-soft:#3b2619; --g3:#7fa6e8; --g3-soft:#1c2a42; --g4:#c39be0; --g4-soft:#2e2238; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:1.6rem;font-weight:700;letter-spacing:.01em}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
header .sync{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
main{flex:1;overflow-y:auto;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main>section{display:none;max-width:760px;margin:0 auto}
main>section.on{display:flex;flex-direction:column;gap:14px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.tabs button{background:none;border:0;padding:10px 4px 8px;font-family:var(--display);font-size:.95rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button.on{color:var(--accent);border-top-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.card.flush{padding:0;overflow:hidden}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:2rem;line-height:1}
button,.btn{font-family:var(--body);font-size:.9rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 9px;font-size:.8rem}
.btn-danger{color:var(--bad);border-color:var(--bad)}
input,select,textarea{font-family:var(--body);font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.advice{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:.9rem}
.advice.ok{border-color:var(--ok);background:var(--ok-soft)}.advice.warn{border-color:var(--warn);background:var(--warn-soft)}.advice.bad{border-color:var(--bad);background:var(--bad-soft)}
.exo{border-top:1px solid var(--line);padding:12px 14px 12px 18px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--gc,transparent)}
.fam{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--gs);color:var(--gc)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--gc);margin-right:5px;vertical-align:-1px}
tr.fam-row td:first-child{border-left:5px solid var(--gc);padding-left:8px}
#print{display:none}
@media print{
  body{background:#fff;color:#000;display:block}
  body>*:not(#print){display:none!important}
  #print{display:block;font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#000;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print h1{font-size:18pt;margin:0 0 2pt}#print h2{font-size:13pt;margin:14pt 0 4pt;padding-left:8pt;border-left:8pt solid var(--gc,#999)}
  #print .meta{font-size:9.5pt;color:#444;margin-bottom:6pt}
  #print table{width:100%;border-collapse:collapse;margin-top:4pt}#print th,#print td{border:1px solid #888;padding:5pt 6pt;font-size:10pt;height:20pt}#print th{background:#eee;font-weight:600;text-align:left}
  #print .reco{font-size:9.5pt;margin:2pt 0 0;color:#222}#print .box{display:inline-block;width:11pt;height:11pt;border:1px solid #000;vertical-align:middle;margin-right:4pt}
  #print .notes{border:1px solid #888;height:60pt;margin-top:6pt}
  #print .exo-p{break-inside:avoid;page-break-inside:avoid}
}
.exo:first-child{border-top:0}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 1fr 36px;gap:6px;align-items:center}
.sets .h{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sets input{padding:6px;text-align:center}
.readiness{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.scale{display:flex;gap:4px}
.scale button{flex:1;padding:6px 0;font-family:var(--display);font-size:1rem}
.scale button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
canvas{width:100%;max-width:100%;display:block}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.empty{text-align:center;padding:24px 14px;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:6px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.timerbar{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--fg);color:var(--bg);display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));box-shadow:0 -2px 8px rgba(0,0,0,.15)}
.timerbar .t{font-family:var(--display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:80px}
.timerbar .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.timerbar button{background:transparent;color:var(--bg);border-color:var(--bg);opacity:.9}
.timerbar.done{background:var(--ok);color:#fff}.timerbar.done button{color:#fff;border-color:#fff}
.timerbar .bar{position:absolute;left:0;top:0;height:3px;background:var(--accent);transition:width .5s linear}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--card);color:var(--fg);border-radius:10px;padding:14px;width:min(420px,100%);max-height:100%;overflow-y:auto}
.play{font-family:var(--display);font-weight:700;color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <div><h1>Carnet de Charge</h1><div class="small muted" id="hdr-sub">Surcharge progressive · autorégulation</div></div>
  <div class="sync" id="sync">local</div>
</header>

<main>
  <section id="tab-seance" class="on"></section>
  <section id="tab-programme"></section>
  <section id="tab-progression"></section>
  <section id="tab-nutrition"></section>
  <section id="tab-profil"></section>
</main>

<nav class="tabs">
  <button class="on" data-tab="seance">Séance</button>
  <button data-tab="programme">Programme</button>
  <button data-tab="progression">Progrès</button>
  <button data-tab="nutrition">Nutrition</button>
  <button data-tab="profil">Profil</button>
</nav>
<div class="toast" id="toast"></div>
<div class="timerbar" id="timerbar" hidden><div class="bar" id="timer-bar"></div><div><div class="lbl" id="timer-lbl">Repos</div><div class="t" id="timer-t">0:00</div></div><span class="grow"></span><button class="btn-sm" id="timer-m30">−30 s</button><button class="btn-sm" id="timer-p30">+30 s</button><button class="btn-sm" id="timer-stop">Stop</button></div>
<div class="modal" id="anim" hidden><div class="modal-box"><div class="row"><div class="grow"><h3 id="anim-title"></h3><div class="small muted" id="anim-sub"></div></div><button class="btn-sm" id="anim-close">Fermer</button></div><canvas id="anim-canvas" height="300" style="margin-top:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)"></canvas><div id="anim-crawl" hidden style="margin-top:10px"><div class="eyebrow">En quoi ça aide le crawl</div><canvas id="crawl-canvas" height="150" style="margin-top:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)"></canvas><p class="small" id="crawl-text" style="margin:6px 0 0"></p></div><ol class="small" id="anim-cues" style="margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px"></ol></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===================== Données de référence ===================== */
const PATTERNS={PH:"Poussée horizontale",PV:"Poussée verticale",TH:"Tirage horizontal",TV:"Tirage vertical",GEN:"Genou dominant (squat)",HAN:"Hanche dominant (charnière)",BIC:"Biceps",TRI:"Triceps",MOL:"Mollets",ABD:"Tronc",EPA:"Épaule (coiffe, stabilité)",POR:"Portage (marche chargée)"};
const FAMILLES={GEN:1,HAN:1,MOL:1,PH:2,PV:2,TRI:2,TH:3,TV:3,BIC:3,ABD:4,EPA:4,POR:4};const FAM_NOM={1:"Jambes & hanches",2:"Poussée",3:"Tirage",4:"Tronc & épaules"};
const famOf=id=>FAMILLES[exo(id).pattern]||4;const famStyle=id=>`--gc:var(--g${famOf(id)});--gs:var(--g${famOf(id)}-soft)`;
const EQUIP={barre:"Barre",halt:"Haltères",machine:"Machine",cable:"Poulie",pdc:"Poids du corps"};
const BASE_EXOS=[
 ["dc_barre","Développé couché barre","PH","barre",2.5],["dc_halt","Développé couché haltères","PH","halt",2],["dc_machine","Développé convergent machine","PH","machine",5],["dc_incl_halt","Développé incliné haltères","PH","halt",2],["pompes","Pompes lestées","PH","pdc",2.5,"lest"],
 ["dm_barre","Développé militaire barre","PV","barre",2.5],["de_halt","Développé épaules haltères","PV","halt",2],["de_machine","Développé épaules machine","PV","machine",5],
 ["row_barre","Rowing barre","TH","barre",2.5],["row_halt","Rowing haltère unilatéral","TH","halt",2],["row_machine","Rowing machine assis","TH","machine",5],["row_cable","Tirage horizontal poulie","TH","cable",5],
 ["tractions","Tractions lestées","TV","pdc",2.5,"lest"],["tractions_assist_m","Tractions assistées (machine)","TV","machine",5,"assist"],["tirage_poulie","Tirage vertical poulie","TV","cable",5],["tirage_machine","Tirage vertical machine","TV","machine",5],
 ["squat","Squat barre","GEN","barre",5],["presse","Presse à cuisses","GEN","machine",10],["hack","Hack squat","GEN","machine",5],["fentes","Fentes haltères","GEN","halt",2],["leg_ext","Leg extension","GEN","machine",5],
 ["sdt","Soulevé de terre","HAN","barre",5],["sdt_roumain","Soulevé de terre roumain","HAN","barre",5],["hip_thrust","Hip thrust","HAN","barre",5],["leg_curl","Leg curl allongé","HAN","machine",5],["leg_curl_assis","Leg curl assis","HAN","machine",5],
 ["curl_barre","Curl barre","BIC","barre",2.5],["curl_halt","Curl haltères","BIC","halt",1],["curl_cable","Curl poulie","BIC","cable",2.5],
 ["ext_tri","Extension triceps poulie","TRI","cable",2.5],["dips","Dips lestés","TRI","pdc",2.5,"lest"],["dips_assist","Dips assistés (machine)","TRI","machine",5,"assist"],["dips_assist_el","Dips assistés (élastique)","TRI","pdc",2.5,"assist"],["barre_front","Barre au front","TRI","barre",2.5],
 ["mollets_debout","Mollets debout machine","MOL","machine",5],["mollets_presse","Mollets à la presse","MOL","machine",10],
 ["crunch_cable","Crunch à la poulie","ABD","cable",2.5],["releve_jambes","Relevés de jambes","ABD","pdc",0],
 // spécifiques natation / poids du corps
 ["pullover_bt","Pull-over poulie bras tendus","TV","cable",2.5],["face_pull","Face pull poulie","EPA","cable",2.5],["rot_ext","Rotation externe élastique","EPA","pdc",0],["ytw","Y-T-W au sol","EPA","pdc",0],
 ["pallof","Pallof press poulie","ABD","cable",2.5],["dead_bug","Dead bug","ABD","pdc",0],["planche_lat","Planche latérale (secondes par côté)","ABD","pdc",0],
 ["rowing_inverse","Rowing inversé (table ou barre basse)","TH","pdc",0],["pont_uni","Pont fessier unilatéral","HAN","pdc",0],["pompes_pike","Pompes pike","PV","pdc",0],["pompes_pdc","Pompes","PH","pdc",0],["tractions_assist","Tractions assistées (élastique)","TV","pdc",2.5,"assist"],["squat_bulgare","Squat bulgare haltères","GEN","halt",1],
 // randonnée
 ["step_up","Step-up sur banc (haltères)","GEN","halt",1],["step_down","Descente de banc contrôlée (excentrique 3 s)","GEN","pdc",0],["fentes_marche","Fentes marchées haltères (pas)","GEN","halt",1],["farmer","Marche du fermier (haltères, mètres)","POR","halt",2]
].map(([id,nom,pattern,equip,incr,flag])=>({id,nom,pattern,equip,incr,lestable:flag==="lest",assist:flag==="assist"}));
const BASE_PROGS=[
 {id:"haut_a",nom:"Haut A — force",exos:[["dc_barre",4,5,8,8],["row_barre",4,6,10,8],["de_halt",3,8,12,8],["tirage_poulie",3,8,12,8],["curl_halt",3,10,15,9],["ext_tri",3,10,15,9]]},

 {id:"bas_b",nom:"Bas B — charnière",exos:[["sdt",3,4,6,8],["hack",3,8,12,8],["hip_thrust",3,10,15,8],["leg_ext",3,12,15,9],["mollets_presse",4,12,20,9],["releve_jambes",3,10,20,9]]}
].map(p=>({id:p.id,nom:p.nom,exos:p.exos.map(([exoId,series,repMin,repMax,rpe])=>({exoId,series,repMin,repMax,rpe}))}));
// Programme de reprise : corps entier, machines et poulies d'abord, 2 séries, 10–15 reps, RPE 6–7 (3–4 reps en réserve)
const REPRISE_PROGS=[
 {id:"rep_a",nom:"Reprise A — corps entier",exos:[["presse",2,10,15,7],["dc_machine",2,10,15,7],["row_cable",2,10,15,7],["leg_curl",2,12,15,7],["de_machine",2,10,15,6.5],["crunch_cable",2,12,20,7]]},
 {id:"rep_b",nom:"Reprise B — corps entier",exos:[["leg_ext",2,12,15,7],["tirage_poulie",2,10,15,7],["dc_halt",2,10,15,7],["row_machine",2,10,15,7],["leg_curl_assis",2,12,15,7],["mollets_presse",2,12,20,7]]}
].map(p=>({id:p.id,nom:p.nom,exos:p.exos.map(([exoId,series,repMin,repMax,rpe])=>({exoId,series,repMin,repMax,rpe}))}));
// Force de soutien pour sportif·ve d'endurance (natation) : peu de séries, charges moyennes-lourdes, repos longs, zéro recherche de fatigue
const NAGE_PROGS=[
 {id:"nage_a",nom:"Salle A — traction & hanches",exos:[["tirage_poulie",3,5,8,8],["pullover_bt",3,8,12,7],["hip_thrust",3,6,10,7.5],["dc_halt",3,6,10,7.5],["face_pull",2,12,15,7],["pallof",2,10,12,7]]},

/* ===================== Science de l'entraînement ===================== */
// e1RM Epley corrigé par le RPE : les reps en réserve (10-RPE) comptent comme des reps
// Charge effective d'une série : barre/haltère = kg saisis ; poids du corps lesté = poids du jour + lest ; assisté = poids du jour − assistance
function effLoad(set,e,bw){if(!e||e.equip!=="pdc"&&!e.assist)return +set.poids||0;if(e.assist)return Math.max(0,bw-(+set.poids||0));if(e.lestable)return bw+(+set.poids||0);return +set.poids||0}
function e1rm(set){if(set.eff!=null){if(!set.eff||!set.reps)return 0;const rir=Math.max(0,10-(set.rpe||8));return set.eff*(1+(set.reps+rir)/30)}if(!set.poids||!set.reps)return 0;const rir=Math.max(0,10-(set.rpe||8));const r=set.reps+rir;return set.poids*(1+r/30)}
function bestE1rm(sets){return Math.max(0,...sets.map(e1rm))}
// Métrique de progression : e1RM si charge, sinon (poids du corps sans lest) meilleure série en reps
const sansLest=sets=>sets.every(s=>!s.poids&&!s.bw);
function metric(sets){return sansLest(sets)?Math.max(0,...sets.map(s=>+s.reps||0)):bestE1rm(sets)}
function metricUnit(sets){return sansLest(sets)?"reps":"kg"}
function histo(exoId){ // séances validées contenant cet exercice, chrono
  return S.seances.filter(s=>s.valide).sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{const x=s.exos.find(e=>e.exoId===exoId&&e.sets.some(filled));if(!x)return null;const e=exo(exoId),bw=s.poidsCorps||S.profil.poids;return{date:s.date,seanceId:s.id,presc:x.presc,sets:x.sets.filter(filled).map(t=>({...t,eff:effLoad(t,e,bw),bw:!!(e.assist||e.lestable)}))}}).filter(Boolean);
}
function readinessFactor(r){if(!r)return{f:1,setDelta:0,label:""};const ks=["sommeil","energie","courbatures"].concat(nage()?["sport"]:[]);const m=ks.reduce((a,k)=>a+(r[k]||4),0)/ks.length;if(m>=4)return{f:1,setDelta:0,label:"Forme bonne : prescription normale"};if(m>=3)return{f:1,setDelta:0,label:"Forme moyenne : garde les charges, ne force pas le RPE"};if(m>=2.2)return{f:.95,setDelta:-1,label:"Forme basse : charges −5 %, une série de moins par exercice"};return{f:.9,setDelta:-1,label:"Fatigue marquée : charges −10 %, une série de moins. Envisage une séance légère"}}
// Recommandation par double progression
function recommande(exoId,presc,rf){
  const e=exo(exoId),h=histo(exoId),rp=reprise();
  if(e.assist){ // exercice assisté : la charge saisie est l'ASSISTANCE, progresser = la réduire
    const bw=S.profil.poids;
    if(!h.length)return{poids:null,texte:"Assisté : note l'assistance en kg (machine : la charge sélectionnée ; élastique : sa valeur indicative). Charge effective = ton poids du jour ("+bw+" kg) − assistance. Progresser = réduire l'assistance.",tag:"nouveau"};
    const last=h[h.length-1],sets=last.sets,avgRpe=sets.reduce((a,t)=>a+(t.rpe||8),0)/sets.length,minA=Math.min(...sets.map(t=>+t.poids||0)),top=sets.filter(t=>(+t.poids||0)===minA);
    let poids=minA,texte,tag;
    if(top.every(t=>t.reps>=presc.repMax)&&avgRpe<=presc.rpe+(rp?0:0.5)){poids=Math.max(0,minA-(e.incr||2.5));if(minA===0){texte="Toutes les séries au haut de la fourchette sans assistance : l'exercice est acquis. Remplace-le par la version lestée (bouton « Machine prise » / « Variante », même schéma moteur) et commence à 0 kg de lest.";tag="progresse"}else{texte="Toutes les séries au haut de la fourchette avec "+minA+" kg d'assistance : passe à "+poids+" kg d'assistance (charge effective ≈ "+Math.round(bw-poids)+" kg).";tag="progresse"}}
    else if(top.some(t=>t.reps<presc.repMin)){poids=minA+(e.incr||2.5);texte="Séries sous "+presc.repMin+" reps : remonte l'assistance à "+poids+" kg.";tag="recule"}
    else{texte="Même assistance ("+minA+" kg) : +1 rep par série (dernière fois "+top.map(t=>t.reps).join("/")+").";tag="reps"}
    if(rf&&rf.f<1){poids=round(poids+(bw-poids)*(1-rf.f),e.incr||2.5);texte+=" Ajusté à ta forme du jour (assistance relevée)."}
    return{poids,texte,tag,last};
  }
  if(e.equip==="pdc"&&!e.lestable&&(!h.length||sansLest(h[h.length-1].sets))){ // poids du corps : progression aux reps, puis lest
    if(!h.length)return{poids:null,texte:"Poids du corps : note 0 en kg (ou le lest). Progression aux reps jusqu'au haut de la fourchette, puis ajoute du lest ou passe à une variante plus dure.",tag:"nouveau"};
    const last=h[h.length-1],reps=last.sets.map(s=>+s.reps),avgRpe=last.sets.reduce((a,s)=>a+(s.rpe||8),0)/last.sets.length;
    if(reps.every(r=>r>=presc.repMax)&&avgRpe<=presc.rpe+0.5)return{poids:0,texte:"Toutes les séries au haut de la fourchette ("+reps.join("/")+"). Passe à la variante plus dure, ajoute un lest de "+(S.profil.poids>=70?5:2.5)+" kg, ou ralentis le tempo (3 s de descente).",tag:"progresse",last};
    if(reps.some(r=>r<presc.repMin))return{poids:0,texte:"Séries sous "+presc.repMin+" reps ("+reps.join("/")+") : prends une variante plus facile ou réduis à 2 séries propres.",tag:"recule",last};
    return{poids:0,texte:"Même variante : +1 rep par série (dernière fois "+reps.join("/")+").",tag:"reps",last};
  }
  if(!h.length&&e.lestable)return{poids:0,texte:"Lesté : note 0 tant que tu es au poids du corps, puis le lest en kg. L'e1RM inclut ton poids du jour ("+S.profil.poids+" kg).",tag:"nouveau"};
  if(!h.length)return{poids:null,texte:rp?"Première fois : prends une charge franchement légère, où tu pourrais faire 5 reps de plus que demandé. Le but des 2 premières semaines est d'apprendre le geste, pas de charger.":"Première fois : choisis une charge où la dernière rep de la série 1 reste propre (RPE ≈ "+presc.rpe+"). L'app calibrera ensuite.",tag:"nouveau"};
  const last=h[h.length-1],sets=last.sets,avgRpe=sets.reduce((a,s)=>a+(s.rpe||8),0)/sets.length,maxP=Math.max(...sets.map(s=>s.poids));
  const top=sets.filter(s=>s.poids===maxP);
  // en reprise : la charge ne monte que si le RPE est resté sous la cible (pas de tolérance), et jamais avant la 3e séance de l'exercice
  const allTop=top.every(s=>s.reps>=presc.repMax)&&avgRpe<=presc.rpe+(rp?0:0.5)&&(!rp||h.length>=3);
  const anyBelow=top.some(s=>s.reps<presc.repMin);
  let poids=maxP,texte,tag;
  if(rp&&h.length<3&&top.every(s=>s.reps>=presc.repMax)){texte="Phase d'apprentissage (séance "+(h.length+1)+"/3 sur cet exercice) : même charge, soigne l'amplitude et le tempo (2 s de descente). La charge montera à partir de la 3e séance.";tag="reps"}
  else if(allTop){poids=maxP+(e.incr||2.5);texte="Dernière fois : toutes les séries au haut de la fourchette ("+presc.repMax+" reps) à RPE "+avgRpe.toFixed(1)+". Monte la charge, vise le bas de la fourchette ("+presc.repMin+").";tag="progresse"}
  else if(anyBelow){poids=round(maxP*0.925,e.incr||2.5);texte="Dernière fois sous "+presc.repMin+" reps : baisse de 7,5 % pour reconstruire des séries propres.";tag="recule"}
  else{texte="Même charge : ajoute une rep sur chaque série (dernière fois "+top.map(s=>s.reps).join("/")+").";tag="reps"}
  // stagnation : 3 séances sans hausse du e1RM
  if(h.length>=4){const e3=h.slice(-4).map(x=>bestE1rm(x.sets));if(e3[3]<=e3[0]*1.005&&e3[2]<=e3[0]*1.005&&e3[1]<=e3[0]*1.005){texte+=" ⚠ Plateau depuis 3 séances : prévois une semaine de décharge (−40 % de volume) ou change de fourchette de reps.";tag="plateau"}}
  if(rf&&rf.f<1){poids=round(poids*rf.f,e.incr||2.5);texte+=" Ajusté à ta forme du jour ("+Math.round((1-rf.f)*100)+" % en moins)."}
  return{poids:round(poids,e.incr||2.5),texte,tag,last};
}
// Substituts : même schéma moteur, différents de l'exercice d'origine, machines indisponibles exclues
function substituts(exoId){const e=exo(exoId),maison=current&&current.lieu==="maison";return S.profil.exercices.filter(x=>x.pattern===e.pattern&&x.id!==exoId&&!S.profil.machinesIndispo.includes(x.id)&&(!maison||x.equip==="pdc"))}
// Estimation de charge sur un substitut à partir de l'historique croisé
function estimeSubstitut(origId,subId){
  const hs=histo(subId);if(hs.length)return{poids:null,texte:"Tu as déjà fait cet exercice : la recommandation ci-dessous vient de ton propre historique.",fromHist:true};
  const ho=histo(origId);if(!ho.length)return{poids:null,texte:"Aucun repère : commence léger et note la première série."};
  const eo=bestE1rm(ho[ho.length-1].sets),a=exo(origId),b=exo(subId);
  // ratios indicatifs par matériel (machine ≈ +15 %, haltères ≈ −20 %, poulie ≈ −10 %, poids du corps : charge additionnelle inconnue)
  const k={barre:1,machine:1.15,halt:.8,cable:.9,pdc:null};
  if(k[a.equip]==null||k[b.equip]==null)return{poids:null,texte:"Pas de conversion fiable avec le poids du corps : démarre à un lest modéré et note."};
  const est=round(eo*(k[b.equip]/k[a.equip])*0.75,b.incr||2.5);
  return{poids:est,texte:"Estimation depuis ton e1RM de "+a.nom+" ("+Math.round(eo)+" kg) : vise ≈ "+est+" kg pour 8–10 reps, puis corrige au ressenti. Après cette séance, l'app utilisera ton vrai historique."};
}
function volumeSemaine(){ // tonnage par semaine ISO sur les 8 dernières semaines
  const m={};S.seances.filter(s=>s.valide).forEach(s=>{const d=new Date(s.date+"T12:00"),w=isoWeek(d);m[w]=(m[w]||0)+s.exos.reduce((a,e)=>a+e.sets.reduce((b,t)=>b+(t.poids||0)*(t.reps||0),0),0)});
  return Object.entries(m).sort().slice(-8);
}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+"-S"+String(Math.ceil(((t-y0)/864e5+1)/7)).padStart(2,"0")}

/* ===================== Nutrition ===================== */
function tdee(p){const bmr=10*p.poids+6.25*p.taille-5*p.age+(p.sexe==="H"?5:-161);const t=bmr*p.activite;const adj={prise:+250,maintien:0,seche:-400,hypertrophie:+150,force:+100,performance:+100}[p.objectif]||0;return{bmr:Math.round(bmr),tdee:Math.round(t),cible:Math.round(t+adj),prot:Math.round(p.poids*(p.objectif==="seche"?2.2:p.objectif==="performance"?1.8:1.8))}}
function tendancePoids(){const n=S.nutrition.filter(x=>x.poids).sort((a,b)=>a.date.localeCompare(b.date));if(n.length<4)return null;const last=n.slice(-7),prev=n.slice(-14,-7);const avg=a=>a.reduce((x,y)=>x+y.poids,0)/a.length;if(!prev.length)return{delta:null,avg:avg(last)};return{delta:avg(last)-avg(prev),avg:avg(last)}}
function conseilNutrition(){
  const t=tdee(S.profil),n=S.nutrition.filter(x=>x.kcal).sort((a,b)=>a.date.localeCompare(b.date)).slice(-7);
  const out=[];
  const imc=S.profil.poids/((S.profil.taille/100)**2);
  if(S.profil.objectif==="performance"||S.profil.niveau==="nage"){out.push({c:imc<18.5?"warn":"",t:"Gros volume d'endurance"+(imc<18.5?" et IMC bas ("+imc.toFixed(1)+")":"")+" : la priorité est de couvrir la dépense, jamais de la sous-estimer. Glucides 5–7 g/kg les jours de nage ("+Math.round(S.profil.poids*5)+"–"+Math.round(S.profil.poids*7)+" g), protéines "+t.prot+" g répartis, et une collation dans l'heure qui suit l'eau. Fatigue qui s'installe, performances qui baissent malgré l'entraînement ou cycles irréguliers sont des signaux de déficit énergétique à prendre au sérieux, avec un avis médical ou diététique du sport."});if(S.profil.objectif==="seche")out.push({c:"bad",t:"Objectif sèche incompatible avec ce profil et ce volume : repasse en Performance."})}
  if(n.length<3)out.push({c:"",t:"Note au moins 3 jours (poids, kcal, protéines) pour un conseil fondé sur ta tendance, pas sur la théorie."});
  else{const k=n.reduce((a,x)=>a+x.kcal,0)/n.length,p=n.reduce((a,x)=>a+(x.prot||0),0)/n.length,tp=tendancePoids();
    if(p<t.prot*0.85)out.push({c:"warn",t:"Protéines à "+Math.round(p)+" g/j en moyenne, cible "+t.prot+" g : c'est le levier n°1 pour la récupération et la surcharge progressive."});else out.push({c:"ok",t:"Protéines ("+Math.round(p)+" g/j) au niveau. Garde 0,4 g/kg par repas réparti sur 3–4 prises."});
    const ecart=k-t.cible;
    if(Math.abs(ecart)>250)out.push({c:"warn",t:"Apport moyen "+Math.round(k)+" kcal, cible "+t.cible+" : écart de "+(ecart>0?"+":"")+Math.round(ecart)+" kcal/j. Ajuste par paliers de 100–150 kcal, pas plus."});
    if(tp&&tp.delta!=null){const d=tp.delta;const obj=S.profil.objectif;
      if((obj==="prise"||obj==="hypertrophie")&&d<0.1)out.push({c:"warn",t:"Poids stable ("+d.toFixed(1)+" kg/sem) alors que tu vises la prise : +150 kcal/j, en glucides autour des séances."});
      if((obj==="prise"||obj==="hypertrophie")&&d>0.5)out.push({c:"warn",t:"+"+d.toFixed(1)+" kg/sem : trop vite pour rester sec, vise 0,25–0,5 kg/sem."});
      if(obj==="seche"&&d>-0.2)out.push({c:"warn",t:"Perte de "+(-d).toFixed(1)+" kg/sem seulement : −150 kcal/j ou +2 000 pas, en gardant les protéines."});
      if(obj==="seche"&&d<-1)out.push({c:"bad",t:"Perte de "+(-d).toFixed(1)+" kg/sem : trop rapide, tu perds du muscle. Remonte de 200 kcal."});
      if(obj==="maintien"&&Math.abs(d)<0.3)out.push({c:"ok",t:"Poids stable, maintien atteint."});
    }
    const lastS=S.seances.filter(s=>s.valide).slice(-1)[0];if(lastS){const r=lastS.readiness;if(r&&r.energie<=2)out.push({c:"",t:"Énergie faible à la dernière séance : vérifie glucides pré-séance (1 g/kg 2–3 h avant) et sommeil."})}
  }
  return out;
}

function progNom(id){const p=S.profil.programmes.find(p=>p.id===id);return p?p.nom:"Séance libre"}
function prochainProgramme(){const ps=S.profil.programmes;if(!ps.length)return null;const last=S.seances.filter(s=>s.valide).sort((a,b)=>b.date.localeCompare(a.date))[0];if(!last)return ps[0];const i=ps.findIndex(p=>p.id===last.programmeId);return ps[(i+1)%ps.length]}
function startSeance(progId){
  const p=S.profil.programmes.find(x=>x.id===progId);
  const oi=objectifInfo();const bonus=(reprise()&&nbValide()>=6?1:0)+(oi&&oi.phase&&oi.phase.setDelta||0); // reprise : 2 séries puis 3 ; affûtage : une de moins

function validerSeance(){
  const done=current.exos.filter(x=>x.sets.some(filled));
  if(!done.length){toast("Aucune série remplie");return}
  const nutJour=S.nutrition.find(n=>n.date===current.date&&n.poids);
  const s={...current,valide:true,poidsCorps:nutJour?nutJour.poids:S.profil.poids,exos:current.exos.map(x=>({...x,sets:x.sets.filter(filled)})).filter(x=>x.sets.length)};
  S.seances.push(s);persistSeance(s);clearCurrent();stopTimer();
  toast("Séance enregistrée");showTab("progression");

/* ---------- Progression ---------- */
let selExo=null;
function renderProgression(){
  const el=$("#tab-progression");
  const avecHisto=S.profil.exercices.filter(e=>histo(e.id).length);
  if(!avecHisto.length){el.innerHTML=`<div class="card empty"><h3>Pas encore de données</h3><p>Valide une séance pour voir l'évolution du e1RM par exercice, le tonnage hebdomadaire et les alertes de plateau.</p></div>`;return}
  if(!selExo||!avecHisto.find(e=>e.id===selExo))selExo=avecHisto[0].id;
  const h=histo(selExo),e=exo(selExo),first=metric(h[0].sets),last=metric(h[h.length-1].sets),gain=last-first,unit=metricUnit(h[h.length-1].sets);
  const plateau=h.length>=4&&h.slice(-3).every(x=>metric(x.sets)<=metric(h[h.length-4].sets)*1.005);
  const vol=volumeSemaine();
  // bilan global : exercices en progression / stagnation
  const bilan=avecHisto.map(x=>{const hh=histo(x.id);if(hh.length<2)return{x,s:"nouveau"};const a=metric(hh[hh.length-1].sets),b=metric(hh[Math.max(0,hh.length-4)].sets);return{x,s:a>b*1.01?"progresse":a<b*0.98?"recule":"stagne"}});
  el.innerHTML=`
  <div class="card"><div class="row"><h2 class="grow">Progression</h2></div>
    <div class="grid3" style="margin-top:10px">
      <div><div class="eyebrow">Séances validées</div><div class="num big">${S.seances.filter(s=>s.valide).length}</div></div>
      <div><div class="eyebrow">En progression</div><div class="num big" style="color:var(--ok)">${bilan.filter(b=>b.s==="progresse").length}</div></div>
      <div><div class="eyebrow">En stagnation</div><div class="num big" style="color:var(--warn)">${bilan.filter(b=>b.s==="stagne"||b.s==="recule").length}</div></div>
    </div></div>
  <div class="card"><div class="row"><select class="grow" id="sel-exo">${avecHisto.map(x=>`<option value="${x.id}" ${x.id===selExo?"selected":""}>${x.nom}</option>`).join("")}</select></div>
    <div class="grid3" style="margin-top:10px">
      <div><div class="eyebrow">${unit==="reps"?"Meilleure série":e.assist||e.lestable?"e1RM (corps inclus)":"e1RM actuel"}</div><div class="num big">${Math.round(last)}<span class="small muted"> ${unit}</span></div></div>
      <div><div class="eyebrow">Gain depuis le début</div><div class="num big" style="color:${gain>=0?"var(--ok)":"var(--bad)"}">${gain>=0?"+":""}${Math.round(gain)}<span class="small muted"> ${unit}</span></div></div>
      <div><div class="eyebrow">Séances</div><div class="num big">${h.length}</div></div>
    </div>
    <canvas id="ch-e1rm" height="200" style="margin-top:10px"></canvas>
    ${plateau?`<div class="advice warn" style="margin-top:10px">Plateau sur ${e.nom} depuis 3 séances. Options par ordre d'efficacité : (1) semaine de décharge à −40 % de volume puis reprise ; (2) passer de ${h[h.length-1].presc?h[h.length-1].presc.repMin+"–"+h[h.length-1].presc.repMax:"la fourchette actuelle"} à une fourchette plus basse ou plus haute pendant 4 semaines ; (3) remplacer par un substitut du même schéma moteur.</div>`:`<div class="advice ok" style="margin-top:10px">${gain>0?"Tendance positive : continue la double progression. Une hausse de 1–2 % par semaine est l'ordre de grandeur réaliste en pratique régulière.":"Pas encore de tendance lisible, continue de noter."}</div>`}
    <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Date</th><th>Séries</th><th class="r">${unit==="reps"?"Reps max":"e1RM"}</th></tr></thead><tbody>${h.slice(-8).reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${x.sets.map(s=>(e.assist?"−"+(+s.poids||0)+"×":e.lestable?"+"+(+s.poids||0)+"×":s.poids?s.poids+"×":"")+s.reps+(s.rpe?"@"+s.rpe:"")).join(" · ")}</td><td class="r num">${Math.round(metric(x.sets))}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="card"><div class="eyebrow">Tonnage hebdomadaire (kg soulevés)</div><canvas id="ch-vol" height="160" style="margin-top:8px"></canvas><p class="small muted" style="margin:6px 0 0">Une hausse régulière du tonnage à RPE constant est le signe d'une surcharge progressive qui fonctionne. Une chute brutale sans décharge planifiée indique de la fatigue accumulée.</p></div>
  <div class="card"><div class="eyebrow">Bilan par exercice</div><div class="list" style="margin-top:8px">${bilan.map(b=>`<div class="item"><span class="grow">${b.x.nom}</span><span class="pill ${{progresse:"ok",stagne:"warn",recule:"bad",nouveau:""}[b.s]}">${b.s}</span></div>`).join("")}</div></div>`;
  $("#sel-exo").onchange=e=>{selExo=e.target.value;renderProgression()};
  lineChart($("#ch-e1rm"),h.map(x=>({x:x.date,y:metric(x.sets)})),unit);
  barChart($("#ch-vol"),vol.map(([w,v])=>({x:w.slice(5),y:Math.round(v)})));
}
function setupCanvas(c){const dpr=window.devicePixelRatio||1,w=c.clientWidth||320,h=+c.getAttribute("height");c.width=w*dpr;c.height=h*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);return{g,w,h}}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function lineChart(c,pts,unit){
  const{g,w,h}=setupCanvas(c);if(!pts.length)return;const pad={l:40,r:12,t:12,b:26};
  const ys=pts.map(p=>p.y),ymin=Math.floor(Math.min(...ys)*0.9/5)*5,ymax=Math.ceil(Math.max(...ys)*1.05/5)*5||10;
  const X=i=>pad.l+(pts.length===1?0.5:i/(pts.length-1))*(w-pad.l-pad.r),Y=v=>pad.t+(1-(v-ymin)/(ymax-ymin))*(h-pad.t-pad.b);
  g.strokeStyle=cssVar("--chart-grid");g.fillStyle=cssVar("--muted");g.font="11px "+cssVar("--body");g.textAlign="right";
  for(let k=0;k<=4;k++){const v=ymin+(ymax-ymin)*k/4,y=Y(v);g.beginPath();g.moveTo(pad.l,y);g.lineTo(w-pad.r,y);g.stroke();g.fillText(Math.round(v),pad.l-6,y+4)}
  g.textAlign="center";const step=Math.ceil(pts.length/5);pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)g.fillText(fmtDate(p.x),X(i),h-8)});
  const line=cssVar("--chart-line");g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(i),Y(p.y)):g.moveTo(X(i),Y(p.y)));g.lineTo(X(pts.length-1),Y(ymin));g.lineTo(X(0),Y(ymin));g.closePath();g.fillStyle=line;g.globalAlpha=.12;g.fill();g.globalAlpha=1;
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(i),Y(p.y)):g.moveTo(X(i),Y(p.y)));g.strokeStyle=line;g.lineWidth=2;g.stroke();
  pts.forEach((p,i)=>{g.beginPath();g.arc(X(i),Y(p.y),i===pts.length-1?5:3,0,7);g.fillStyle=line;g.fill()});
  const l=pts[pts.length-1];g.fillStyle=cssVar("--fg");g.font="bold 12px "+cssVar("--display");g.textAlign="right";g.fillText(Math.round(l.y)+" "+unit,X(pts.length-1)-8,Y(l.y)-8);
}
function barChart(c,pts){
  const{g,w,h}=setupCanvas(c);if(!pts.length)return;const pad={l:44,r:8,t:12,b:24};const ymax=Math.max(...pts.map(p=>p.y))*1.1||1;
  const bw=(w-pad.l-pad.r)/pts.length,Y=v=>pad.t+(1-v/ymax)*(h-pad.t-pad.b);
  g.strokeStyle=cssVar("--chart-grid");g.fillStyle=cssVar("--muted");g.font="11px "+cssVar("--body");g.textAlign="right";
  for(let k=0;k<=3;k++){const v=ymax*k/3,y=Y(v);g.beginPath();g.moveTo(pad.l,y);g.lineTo(w-pad.r,y);g.stroke();g.fillText(v>=1000?(v/1000).toFixed(1)+"t":Math.round(v),pad.l-6,y+4)}
  g.textAlign="center";pts.forEach((p,i)=>{const x=pad.l+i*bw;g.fillStyle=cssVar("--chart-line");g.globalAlpha=i===pts.length-1?1:.6;g.fillRect(x+bw*.15,Y(p.y),bw*.7,Y(0)-Y(p.y));g.globalAlpha=1;g.fillStyle=cssVar("--muted");g.fillText(p.x,x+bw/2,h-8)});
}

function drawPose(c,a,u){

const CRAWL_BY_PATTERN={TV:["pull","Traction : le grand dorsal, moteur principal du crawl."],TH:["pull","Omoplates et dorsal : la fin de traction et une épaule saine."],PH:["finish","Pectoraux et triceps : la poussée finale jusqu'à la cuisse."],TRI:["finish","Triceps : la fin de poussée."],PV:["shoulder","Deltoïdes : le retour aérien et l'entrée dans l'eau."],EPA:["shoulder","Coiffe des rotateurs : prévention de l'épaule du nageur."],HAN:["kick","Hanches et ischios : le battement et la ligne d'eau."],GEN:["kick","Jambes : poussée au mur et battement."],MOL:["kick","Mollets et chevilles : la palme naturelle."],ABD:["core","Tronc : rotation et corps horizontal."],BIC:["pull","Coude haut à la prise d'eau."]};
function crawlInfo(exoId){return CRAWL_BY_ID[exoId]||CRAWL_BY_PATTERN[exo(exoId).pattern]||null}
function drawSwimmer(c,zone,t){
  const dpr=window.devicePixelRatio||1,W=c.clientWidth||300,H=Math.round(W*0.5);if(c.width!==W*dpr){c.width=W*dpr;c.height=H*dpr}
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const fg=cssVar("--fg"),acc=cssVar("--chart-line"),mut=cssVar("--line"),water=cssVar("--accent-soft");
  // eau
  g.fillStyle=water;g.globalAlpha=.5;g.fillRect(0,H*.36,W,H*.64);g.globalAlpha=1;g.strokeStyle=mut;g.lineWidth=2;g.beginPath();for(let x=0;x<=W;x+=8){g.lineTo(x,H*.36+Math.sin(x/18+t*4)*2)}g.stroke();
  const a=t*2*Math.PI; // cycle du bras (0 = entrée dans l'eau devant)
  const phase=a%(2*Math.PI)<Math.PI?(a%(2*Math.PI)<Math.PI*0.55?"pull":"finish"):"shoulder";
  const pulse=0.55+0.45*Math.sin(t*2*Math.PI*2);
  const hl=z=>zone===z?acc:fg,lw=z=>zone===z?Math.max(5,W*.03)*(0.8+0.3*pulse):Math.max(4,W*.02);
  const roll=Math.sin(a)*0.02;
  const sh=[W*.64,H*.40],hip=[W*.36,H*.42+roll*H],head=[W*.72,H*.37];
  g.lineCap="round";
  // jambes (battement)
  const k1=Math.sin(t*2*Math.PI*3)*H*.05,k2=-k1;
  g.strokeStyle=hl("kick");g.lineWidth=lw("kick");
  [[k1],[k2]].forEach(([k])=>{g.beginPath();g.moveTo(hip[0],hip[1]);g.lineTo(W*.22,hip[1]+k*.6);g.lineTo(W*.08,hip[1]+k);g.stroke()});
  // tronc
  g.strokeStyle=hl("core");g.lineWidth=lw("core");g.beginPath();g.moveTo(hip[0],hip[1]);g.lineTo(sh[0],sh[1]);g.stroke();
  // tête
  g.fillStyle=fg;g.beginPath();g.arc(head[0],head[1],W*.035,0,7);g.fill();
  // bras 1 (cycle) : sous l'eau de 0 à π (vers l'arrière), retour aérien de π à 2π
  const R=W*.22;
  const arm=(ang)=>{const under=Math.sin(ang)>=0;const hand=[sh[0]+Math.cos(ang)*R,sh[1]+Math.sin(ang)*(under?H*.40:H*.16)];
    const mid=[(sh[0]+hand[0])/2,(sh[1]+hand[1])/2];const el=under?[mid[0],Math.min(hand[1]-H*.02,sh[1]+H*.14)]:[mid[0],mid[1]-H*.10];
    let col=fg,width=Math.max(4,W*.02);
    if(zone==="pull"&&under&&phase==="pull"){col=acc;width=lw("pull")}
    if(zone==="finish"&&under&&phase==="finish"){col=acc;width=lw("finish")}
    if(zone==="shoulder"&&!under){col=acc;width=lw("shoulder")}
    g.strokeStyle=col;g.lineWidth=width;g.lineJoin="round";g.beginPath();g.moveTo(sh[0],sh[1]);g.lineTo(el[0],el[1]);g.lineTo(hand[0],hand[1]);g.stroke();
    g.fillStyle=col;g.beginPath();g.arc(hand[0],hand[1],W*.014,0,7);g.fill();};
  arm(a+Math.PI);arm(a);
  // épaule en surbrillance
  if(zone==="shoulder"){g.fillStyle=acc;g.globalAlpha=.35+.3*pulse;g.beginPath();g.arc(sh[0],sh[1],W*.04,0,7);g.fill();g.globalAlpha=1}
  // libellé de phase
  g.fillStyle=cssVar("--muted");g.font="11px "+cssVar("--body");g.textAlign="left";
  g.fillText({pull:"Traction sous l'eau",finish:"Fin de poussée",shoulder:"Retour aérien"}[phase],8,H-8);
}


/* ===================== Objectif daté : périodisation ===================== */
// Chemin de Stevenson, étapes hautes : montées longues, descentes raides, sac. 4 phases comptées à rebours depuis la date.
const RANDO_PHASES=[
 {id:"affutage",nom:"Affûtage",sem:3,progs:"RANDO_SPEC",setDelta:-1,marche:"Dernière grosse marche 10–12 jours avant le départ. Semaine du départ : une marche d'1 h sans sac, rien de lourd. Garde les charges, enlève une série partout."},
 {id:"specifique",nom:"Spécifique montée-descente",sem:8,progs:"RANDO_SPEC",setDelta:0,marche:"Une marche longue par semaine avec le sac, sur du dénivelé (escaliers, terrils, Ardennes) : sem. 1 → 2 h / 6 kg · 2 → 2 h 30 / 7 kg · 3 → 3 h / 8 kg · 4 → 2 h / 8 kg (décharge) · 5 → 3 h 30 / 9 kg · 6 → deux jours consécutifs 3 h + 3 h / 10 kg · 7 → 5 h / 10–12 kg · 8 → 3 h / 10 kg. Descends en contrôle : c'est la descente qui casse les cuisses."},
 {id:"base",nom:"Base force",sem:8,progs:"RANDO_BASE",setDelta:0,marche:"Une marche d'1 h 30 à 2 h par semaine, sac de 5 kg, en cherchant les côtes et les escaliers. Objectif : des jambes qui encaissent 3 séances de salle par semaine sans douleur."},
 {id:"reprise",nom:"Reprise",sem:99,progs:null,setDelta:0,marche:"Une marche d'1 h par semaine, sans sac, à bonne allure. On construit l'habitude et les tissus avant la charge."}
];
const RANDO_BASE=[
 {id:"rb_a",nom:"Base A — jambes & tirage",exos:[["presse",3,8,12,7.5],["step_up",3,8,12,7],["sdt_roumain",3,8,12,7.5],["row_cable",3,10,12,7.5],["dc_machine",3,10,12,7.5],["mollets_presse",3,12,20,7],["crunch_cable",3,12,20,7]]},
 {id:"rb_b",nom:"Base B — unilatéral & portage",exos:[["squat_bulgare",3,8,12,7],["leg_curl",3,10,15,7.5],["hip_thrust",3,8,12,7.5],["tirage_poulie",3,8,12,7.5],["de_machine",3,10,12,7],["farmer",3,40,60,7],["planche_lat",2,30,45,7]]}
].map(p=>({id:p.id,nom:p.nom,exos:p.exos.map(([exoId,series,repMin,repMax,rpe])=>({exoId,series,repMin,repMax,rpe}))}));
const RANDO_SPEC=[
 {id:"rs_a",nom:"Spé A — montée & portage",exos:[["step_up",4,8,12,8],["step_down",3,10,15,7],["sdt_roumain",3,6,10,8],["farmer",3,60,100,7.5],["mollets_debout",3,12,20,7.5],["dead_bug",2,8,12,7]]},
 {id:"rs_b",nom:"Spé B — descente & hanches",exos:[["fentes_marche",3,10,16,7.5],["squat_bulgare",3,8,12,8],["hip_thrust",3,8,12,8],["row_halt",3,8,12,7.5],["dc_halt",2,8,12,7],["planche_lat",2,30,45,7]]}
].map(p=>({id:p.id,nom:p.nom,exos:p.exos.map(([exoId,series,repMin,repMax,rpe])=>({exoId,series,repMin,repMax,rpe}))}));
const PROG_SETS={RANDO_BASE,RANDO_SPEC};
function objectifInfo(){
  const o=S.profil.objectif_evt;if(!o||!o.date)return null;
  const target=new Date(o.date+"T12:00"),now=new Date(today()+"T12:00"),jours=Math.round((target-now)/864e5);
  if(jours<0)return{o,jours,passe:true};
  const semRest=jours/7;let cum=0,phase=null,semDansPhase=0,idx=0;
  for(let i=0;i<RANDO_PHASES.length;i++){const p=RANDO_PHASES[i];if(semRest<cum+p.sem){phase=p;idx=RANDO_PHASES.length-i;semDansPhase=Math.floor(p.sem-(semRest-cum))+1;break}cum+=p.sem}
  if(phase.id==="reprise")semDansPhase=null;
  return{o,jours,phase,numero:idx,semDansPhase};
}
function objectifCardHtml(){
  const i=objectifInfo();if(!i)return"";
  if(i.passe)return`<div class="card"><div class="eyebrow">Objectif</div><h3>${i.o.nom}</h3><p class="small muted">Date passée. Change-la dans Profil pour relancer une périodisation.</p></div>`;
  const ph=i.phase,progs=ph.progs?PROG_SETS[ph.progs]:null,charge=progs&&!progs.every(p=>S.profil.programmes.some(q=>q.id===p.id));
  return`<div class="card"><div class="row"><div class="grow"><div class="eyebrow">Objectif · J−${i.jours}</div><h3>${i.o.nom}</h3><div class="small muted">${fmtDate(i.o.date)} · Phase ${i.numero}/4 : <strong>${ph.nom}</strong>${i.semDansPhase?" · semaine "+i.semDansPhase+"/"+ph.sem:""}</div></div></div>
    <div class="advice" style="margin-top:8px"><strong>Marche :</strong> ${ph.marche}</div>
    ${ph.id==="specifique"||ph.id==="affutage"?`<div class="small muted" style="margin-top:6px">Salle 2×/semaine, jamais la veille de la marche longue. Les descentes de banc se font en 3 s, c'est l'exercice anti-cuisses-cassées du 3e jour.</div>`:""}
    ${charge?`<div class="row" style="margin-top:8px"><button class="btn-primary btn-sm" id="btn-phase-prog">Charger le programme « ${ph.nom} »</button></div>`:progs?`<div class="small muted" style="margin-top:6px">Programme de phase chargé.</div>`:""}
  </div>`;
}
function bindObjectif(){const b=$("#btn-phase-prog");if(b)b.onclick=()=>{const ph=objectifInfo().phase;S.profil.programmes=JSON.parse(JSON.stringify(PROG_SETS[ph.progs]));S.profil.joursSemaine=ph.progs==="RANDO_BASE"?3:2;persistProfil();toast("Programme « "+ph.nom+" » chargé");render()}}

/* ===================== Minuteur de repos ===================== */
// Basé sur une heure de fin absolue : survit au rafraîchissement, à la mise en veille et au changement d'onglet.
let timer=null,timerTick=null,audioCtx=null;
function reposDefaut(){return S.profil.repos||(nage()?150:120)}
function loadTimer(){try{const t=JSON.parse(localStorage.getItem(LS+"timer"));if(t&&t.end>Date.now()-15000)timer=t}catch(e){}}
function saveTimer(){try{if(timer)localStorage.setItem(LS+"timer",JSON.stringify(timer));else localStorage.removeItem(LS+"timer")}catch(e){}}
function startTimer(sec,label){sec=sec||reposDefaut();timer={end:Date.now()+sec*1000,dur:sec,label:label||"Repos",fired:false};saveTimer();primeAudio();runTimer()}
function stopTimer(){timer=null;saveTimer();clearInterval(timerTick);timerTick=null;const b=$("#timerbar");if(b){b.hidden=true;b.classList.remove("done")}document.title=baseTitle}
function adjustTimer(d){if(!timer)return;timer.end+=d*1000;timer.dur=Math.max(5,timer.dur+d);timer.fired=false;saveTimer();tickTimer()}
const baseTitle=document.title;
function runTimer(){clearInterval(timerTick);timerTick=setInterval(tickTimer,250);tickTimer()}
function tickTimer(){const b=$("#timerbar");if(!timer){if(b)b.hidden=true;return}b.hidden=false;
  const rem=Math.ceil((timer.end-Date.now())/1000),m=Math.floor(Math.abs(rem)/60),sN=Math.abs(rem)%60,txt=(rem<0?"+":"")+m+":"+String(sN).padStart(2,"0");
  $("#timer-t").textContent=txt;$("#timer-lbl").textContent=rem>0?timer.label:"Repos terminé";$("#timer-bar").style.width=Math.max(0,Math.min(100,100*(1-(timer.end-Date.now())/(timer.dur*1000))))+"%";
  b.classList.toggle("done",rem<=0);document.title=(rem>0?"⏱ "+txt+" · ":"✓ ")+baseTitle;
  if(rem<=0&&!timer.fired){timer.fired=true;saveTimer();beep();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,500])}catch(e){}}
  if(rem<=-60)stopTimer();}
function primeAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
function beep(){try{if(!audioCtx)return;const t0=audioCtx.currentTime;[0,0.35,0.7].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=i===2?1046:880;g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(0.5,t0+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.28);o.connect(g).connect(audioCtx.destination);o.start(t0+d);o.stop(t0+d+0.3)})}catch(e){}}
document.addEventListener("click",e=>{if(e.target.id==="timer-stop")stopTimer();if(e.target.id==="timer-p30")adjustTimer(30);if(e.target.id==="timer-m30")adjustTimer(-30)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&timer)tickTimer()});
/* ===================== Fiche imprimable ===================== */

  const rf=readinessFactor(sess.readiness);
  const html=`<h1>${progNom(sess.programmeId)}</h1>
  <div class="meta">${new Date(sess.date+"T12:00").toLocaleDateString("fr-BE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})} · ${S.profil.prenom||""} · poids du jour : ______ kg · Forme (1–5) : sommeil ___ énergie ___ courbatures ___${nage()?" fraîcheur natation ___":""}</div>
  <div class="meta">${[1,2,3,4].map(k=>`<span style="display:inline-block;width:9pt;height:9pt;background:var(--g${k});margin:0 3pt 0 8pt;vertical-align:-1pt"></span>${FAM_NOM[k]}`).join("")}</div>
  ${sess.exos.map(x=>{const e=exo(x.exoId),rec=recommande(x.exoId,x.presc,rf),n=Math.max(1,x.presc.series+(rf.setDelta||0))+1;const col=e.assist?"Assist. kg":e.lestable?"Lest kg":"Kg";
    return`<div class="exo-p" style="${famStyle(x.exoId)}"><h2>${e.nom} <span style="font-weight:400;font-size:10pt">— ${x.presc.series}×${x.presc.repMin}–${x.presc.repMax} · RPE ${x.presc.rpe}${x.origId?" · remplace "+exo(x.origId).nom:""}</span></h2>
    <div class="reco">${rec.poids!=null?"<strong>Proposé : "+rec.poids+" "+(e.assist?"kg d'assistance":"kg")+"</strong> · ":""}${rec.texte.replace(/⚠.*$/,"")}${rec.last?"<br>Dernière fois ("+fmtDate(rec.last.date)+") : "+rec.last.sets.map(t=>(e.assist?"−":e.lestable?"+":"")+(t.poids||0)+"×"+t.reps+(t.rpe?"@"+t.rpe:"")).join(" · "):""}</div>
    <table><thead><tr><th style="width:8%">#</th><th style="width:22%">${col}</th><th style="width:22%">Reps</th><th style="width:18%">RPE</th><th>Remarque</th></tr></thead><tbody>${Array.from({length:n},(_,j)=>`<tr><td>${j+1}</td><td></td><td></td><td></td><td></td></tr>`).join("")}</tbody></table></div>`}).join("")}
  <h2 style="border-left-color:#999">Notes de séance</h2><div class="notes"></div>
  <div class="meta" style="margin-top:8pt">Au retour : onglet Séance → Démarrer → recopier les séries → Valider. Les colonnes vides ne sont pas enregistrées.</div>`;
  let el=$("#print");if(!el){el=document.createElement("div");el.id="print";document.body.appendChild(el)}el.innerHTML=html;
  window.print();
}
